name: Release (flutter)

on:
  release:
    types: [created]
  workflow_run:
    workflows:
      - "Build"
      - "Test"
    branches: [ master ]
    types:
      - completed

jobs:
  publishing:
    # 'release' has no tag filter — GitHub ignores `tags:` under `on: release`,
    # so every release event reaches this job. Gate on the tag name here: the
    # flutter package must not publish until the client it depends on is live.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'graphql_flutter_plus-v')
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4 # required!

      - name: 'Check publish credentials'
        id: creds
        uses: ./.github/actions/check-publish-creds
        with:
          credential_json: ${{ secrets.CREDENTIAL_JSON }}

      - name: 'publish graphql_flutter_plus to Pub.dev'
        if: steps.creds.outputs.skip == 'false'
        uses: k-paxian/dart-package-publisher@master
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true
          force: true
          dryRunOnly: ${{ github.event_name != 'release' }}
          relativePath: './packages/graphql_flutter_plus/'
