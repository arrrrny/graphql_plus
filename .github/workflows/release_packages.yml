name: Release (packages)

on:
  release:
    types: [created]
jobs:
  publishing_client:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Check publish credentials'
        id: creds
        uses: ./.github/actions/check-publish-creds
        with:
          credential_json: ${{ secrets.CREDENTIAL_JSON }}

      - name: 'graphql_plus publish to Pub.dev'
        if: steps.creds.outputs.skip == 'false'
        uses: k-paxian/dart-package-publisher@master
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: false
          skipTests: true
          force: true
          dryRunOnly: ${{ github.event_name != 'release' }}
          relativePath: './packages/graphql_plus/'
  publishing_flutter:
    runs-on: ubuntu-latest
    needs:
      - publishing_client
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        # FIXME: when we bump a new release, we can have problem
        # in dry mode because the new release is not on the pub.dev
        # yet
        # TODO: we need to have some bump function for dart in the changelog.dat tool.
      - name: 'Check publish credentials'
        id: creds
        uses: ./.github/actions/check-publish-creds
        with:
          credential_json: ${{ secrets.CREDENTIAL_JSON }}
      - name: 'graphql_flutter_plus publish to Pub.dev'
        if: steps.creds.outputs.skip == 'false'
        uses: k-paxian/dart-package-publisher@master
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: false
          skipTests: true
          dryRunOnly: ${{ github.event_name != 'release' }}
          relativePath: './packages/graphql_flutter_plus/'
